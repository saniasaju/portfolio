<!DOCTYPE html>
<html lang="en" class="home-is-revealed">


<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'none'; img-src 'self'; font-src 'self'; media-src 'self' blob:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'none'">
    <meta name="referrer" content="no-referrer">
    <script src="./js/components/navigation.js"></script>
    <link rel="stylesheet" href="./css/pages/home.css">

    <!-- =========================================================
         META
    ========================================================== -->

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Portfolio of Sania Saju — UX designer combining thoughtful design, accessibility and front-end development."
    >

    <meta
        name="author"
        content="Sania Saju"
    >


    <!-- =========================================================
         TITLE
    ========================================================== -->

    <title>Sania Saju — UI/UX Designer</title>


    <!-- =========================================================
         FAVICON
    ========================================================== -->

    <link
        rel="icon"
        type="image/svg+xml"
        href="./assets/icons/favicon.svg"
    >


    <!-- =========================================================
         BASE CSS
    ========================================================== -->

    
    <link
        rel="stylesheet"
        href="./assets/vendor/lenis/lenis.css"
    >


    <link
        rel="stylesheet"
        href="./css/style.css"
    >

    <link
        rel="stylesheet"
        href="./css/index.css"
    >


    <!-- =========================================================
         COMPONENT CSS
    ========================================================== -->

    <link
        rel="stylesheet"
        href="./css/components/navbar.css"
    >

    <link
        rel="stylesheet"
        href="./css/components/arrow.css"
    >


    <!-- =========================================================
         SECTION CSS
    ========================================================== -->

    <link
        rel="stylesheet"
        href="./css/sections/hero.css"
    >

    <link
        rel="stylesheet"
        href="./css/sections/projects.css"
    >

    <link
        rel="stylesheet"
        href="./css/sections/pages.css"
    >

    <link
        rel="stylesheet"
        href="./css/sections/about.css"
    >

    <link
        rel="stylesheet"
        href="./css/sections/contact.css"
    >

    <link rel="stylesheet" href="./css/responsive.css">
</head>



<body>




    <!-- =========================================================
         HOME
    ========================================================== -->

    <main class="home">


        <!-- =====================================================
             01 — HERO
        ====================================================== -->

        <section
            class="hero is-core-visible is-title-visible is-chrome-visible"
            id="home"
            aria-label="Introduction"
        >


            <!-- =================================================
                 NAVBAR
            ================================================== -->

            <portfolio-navbar></portfolio-navbar>



            <!-- =================================================
                 HERO CONTENT
            ================================================== -->

            <div class="hero__content">


                <!-- =============================================
                     HERO TITLE COMPOSITION
                ============================================== -->

                <div
                    class="hero__title"
                    aria-label="Designer Developer"
                >


                    <!-- CENTRAL D -->

                    <img
                        class="
                            hero__title-layer
                            hero__title-core
                        "
                        src="./assets/images/d.svg"
                        alt=""
                        aria-hidden="true"
                    >


                    <!-- LEFT METADATA -->

                    <img
                        class="
                            hero__title-layer
                            hero__title-metadata
                            hero__title-metadata-left
                        "
                        src="./assets/images/metadata-left.svg"
                        alt=""
                        aria-hidden="true"
                    >


                    <!-- ESIGNER -->

                    <img
                        class="
                            hero__title-layer
                            hero__title-esigner
                        "
                        src="./assets/images/esigner.svg"
                        alt=""
                        aria-hidden="true"
                    >


                    <!-- EVELOPER -->

                    <img
                        class="
                            hero__title-layer
                            hero__title-eveloper
                        "
                        src="./assets/images/eveloper.svg"
                        alt=""
                        aria-hidden="true"
                    >


                    <!-- RIGHT METADATA -->

                    <img
                        class="
                            hero__title-layer
                            hero__title-metadata
                            hero__title-metadata-right
                        "
                        src="./assets/images/metadata-right.svg"
                        alt=""
                        aria-hidden="true"
                    >


                </div>


            </div>



            <!-- =================================================
                 HERO FOOTER
            ================================================== -->

            <div class="hero__footer">


                <!-- =============================================
                     SOCIAL LINKS
                ============================================== -->

                <div
                    class="hero__socials"
                    aria-label="Social links"
                >


                    <!-- RESUME -->

                    <a
                        class="social-link"
                        href="https://drive.google.com/file/d/1Tv4DNQOfUqFfgtIkCHrTz7Y5IOp73n3v/view?usp=drive_link"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Resume"
                    >

                        <img
                            src="./assets/icons/resume.svg"
                            alt=""
                            aria-hidden="true"
                        >

                    </a>


                    <!-- EMAIL -->

                    <button
                        class="social-link social-link--email"
                        type="button"
                        data-email="saniasaju.k@gmail.com"
                        aria-label="Copy email address"
                    >
                        <img
                            src="./assets/icons/email.svg"
                            alt=""
                            aria-hidden="true"
                        >

                        <span
                            class="copy-feedback"
                            role="status"
                            aria-live="polite"
                        >
                            Email copied!
                        </span>
                    </button>

                    <!-- LINKEDIN -->

                    <a
                        class="social-link"
                        href="https://www.linkedin.com/in/sania-saju-50266322a"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="LinkedIn"
                    >

                        <img
                            src="./assets/icons/linkedin.svg"
                            alt=""
                            aria-hidden="true"
                        >

                    </a>


                    <!-- GITHUB -->

                    <a
                        class="social-link"
                        href="https://github.com/saniasaju"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="GitHub"
                    >

                        <img
                            src="./assets/icons/github.svg"
                            alt=""
                            aria-hidden="true"
                        >

                    </a>


                    <!-- BEHANCE -->

                    <a
                        class="social-link"
                        href="https://www.behance.net/sania-saju"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Behance"
                    >

                        <img
                            src="./assets/icons/behance.svg"
                            alt=""
                            aria-hidden="true"
                        >

                    </a>


                </div>



                <!-- =============================================
                     SCROLL CTA
                ============================================== -->

                <a
                    class="hero__scroll"
                    href="#work"
                >

                    <span class="hero__scroll-label">
                        View Selected Projects
                    </span>


                    <portfolio-arrow
                        direction="down"
                    ></portfolio-arrow>

                </a>


            </div>


        </section>



        <!-- =====================================================
             02 — SELECTED PROJECTS
        ====================================================== -->

        <section
            class="
                home-section
                home-section--projects
            "
            id="work"
            aria-label="Selected Projects"
        >

            <projects-section></projects-section>

        </section>



        <!-- =====================================================
             03 — PAGES / PIXELS
        ====================================================== -->

        <section
            aria-label="Pixels"
        >

            <pages-section></pages-section>

        </section>



        <!-- =====================================================
             04 — ABOUT
        ====================================================== -->

        <section
            class="
                home-section
                home-section--about
            "
            id="about"
            aria-label="About"
        >

            <about-section></about-section>

        </section>



        <!-- =====================================================
             05 — CONTACT
        ====================================================== -->

        <section
            class="
                home-section
                home-section--contact
            "
            id="contact"
            aria-label="Contact"
        >

            <contact-section></contact-section>

        </section>


    </main>


    <!-- =========================================================
        JAVASCRIPT
    ========================================================== -->

        <!-- LENIS LIBRARY -->
        <script src="./assets/vendor/lenis/lenis.min.js"></script>

        <!-- LENIS INITIALIZATION -->
        <script src="./js/components/lenis.js"></script>


    <!-- =========================================================
         COMPONENT JAVASCRIPT
    ========================================================== -->

    <script
        src="./js/components/arrow.js"
        defer
    ></script>

    <script
        src="./js/components/navbar.js"
        defer
    ></script>



    <!-- =========================================================
         SECTION JAVASCRIPT
    ========================================================== -->

    <script
        src="./js/sections/hero.js"
        defer
    ></script>

    <script
        src="./js/sections/projects.js"
        defer
    ></script>

    <script
        src="./js/sections/pages.js"
        defer
    ></script>

    <script
        src="./js/sections/about.js"
        defer
    ></script>

    <script
        src="./js/sections/contact.js"
        defer
    ></script>



    <!-- =========================================================
         GLOBAL JAVASCRIPT
    ========================================================== -->

    <!-- GLOBAL SCRIPT -->
    <script src="./js/script.js"></script>



</body>


</html>
